# Runs tests and builds the debug APK on pushes to main; tags and manual runs also build the release.
# Works on GitHub Actions and on Forgejo/Gitea Actions (use a runner image that has Docker, e.g. catthehacker/ubuntu:act-latest).
name: Android

# The private repo has 2,000 Actions minutes a month and a run takes ~8: pushes that change
# no app code (docs, Markdown, the relay, issue templates) don't build.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "relay/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/FUNDING.yml"
      - ".github/pull_request_template.md"
      - ".github/workflows/report-relay.yml"
      - ".github/workflows/label-reports.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "relay/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/FUNDING.yml"
      - ".github/pull_request_template.md"
      - ".github/workflows/report-relay.yml"
      - ".github/workflows/label-reports.yml"
  workflow_dispatch:

# Read-only by default; only the publish job (tags) can write, to create the release.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the build still running; tags always finish.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default also asks for the long-gone "tools" package, which fails the job.
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit and screenshot tests, lint
        run: ./gradlew --no-daemon :app:verifyRoborazziDebug :app:lintDebug

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/outputs/roborazzi/
            app/build/reports/lint-results-debug.html

      # Without the key the release build stops (it never falls back to the public debug key).
      - name: Require the signing key for a release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEY != 'true'
        run: |
          echo "::error::KEYSTORE_BASE64 is not set: refusing to publish a debug-signed release."
          exit 1

      - name: Decode signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The Adobe client ID goes only into tagged releases: on a public repository the APK artifacts of
      # every push are downloadable, and Adobe allows public distribution only once the app is approved.
      - name: Build
        env:
          FINALISH_IMSCLIENTID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.IMS_CLIENT_ID || '' }}
          FINALISH_REDIRECTURI: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.IMS_REDIRECT_URI || '' }}
          # Report relay URL (repository variable); unset, the app shares reports instead.
          FINALISH_REPORTRELAY: ${{ vars.FINALISH_REPORTRELAY }}
          FINALISH_KEYSTORE: ${{ env.HAS_KEY == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          FINALISH_KEYSTOREPASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FINALISH_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          FINALISH_KEYPASSWORD: ${{ secrets.KEY_PASSWORD }}
        # The release key is the Play upload key: Google re-signs the bundle with the app signing key.
        # Release builds (R8, a few minutes) only for tags and manual runs; pushes build the debug APK.
        run: ./gradlew --no-daemon assembleDebug ${{ env.HAS_KEY == 'true' && env.RELEASE == 'true' && 'assembleRelease bundleRelease' || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finalish-apks
          retention-days: 7
          path: app/build/outputs/apk/**/*.apk

      # The App Bundle Play asks for; kept out of the GitHub release, which ships the APK.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.HAS_KEY == 'true' && env.RELEASE == 'true'
        with:
          name: finalish-bundle
          retention-days: 30
          path: app/build/outputs/bundle/release/*.aab

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: finalish-apks
          path: apks

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: apks/release/*.apk
