# Monthly, grouped update PRs for Gradle dependencies, pinned GitHub Actions and the relay's npm
# packages: each PR runs CI, and the private repo's Actions minutes are limited.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /relay
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
